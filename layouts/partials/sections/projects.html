<section id="projects" class="py-0 py-sm-5">
  <div class="container bg-transparent">
    <h3 class="text-center bg-transparent">Projects</h3>

    <div class="row justify-content-center px-3 px-md-5">
      {{ range sort (where .Site.RegularPages "Section" "projects") ".Date" "desc" }}
      {{ if .Params.showInHome | default true }}

      <div class="col-xl-4 col-lg-5 col-md-6 my-4">

        <a class="project-card-link"
            href="{{ .Params.projectUrl }}"
            target="_blank"
            rel="noopener">

            <article class="project-card">

            <div class="project-image">
                <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}">
            </div>

            <div class="project-content">
                <h5 class="project-title">
                {{ .Title }}
                </h5>
            </div>

            </article>

        </a>

        </div>

      {{ end }}
      {{ end }}
    </div>
  </div>
</section>
